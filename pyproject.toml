[build-system]
# Story 127.481: the standard PEP 517 backend. The former "setuptools.backends.legacy:build"
# does not exist, so every `pip install -e .` (CI's install step) failed.
# setuptools>=77 for the SPDX-string `project.license` below (the TOML-table form is
# deprecated and stops building in 2027).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toke-tokenizer"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Matthew Watt"}]

[project.optional-dependencies]
train = [
    "sentencepiece>=0.1.99",
]
eval = [
    "sentencepiece>=0.1.99",
    "tiktoken>=0.5",
]
dev = [
    "pytest>=7",
    # Pinned to a minor series on purpose (story 130.19): ruff's DEFAULT rule set grows
    # between minors, so an unpinned `ruff>=0.4` makes `make lint` red or green depending
    # on the day CI ran. The repo is clean under the 0.16 default set.
    "ruff>=0.16,<0.17",
    "mypy>=1.8",
    # Typed deps that the checked sources import: mypy must see the same types in CI as
    # locally, otherwise they degrade to Any there and the two runs disagree.
    "numpy>=1.26",
    "tiktoken>=0.7",
]

# This root project exists to install the dev/train/eval dependencies (CI runs
# `pip install -e ".[dev]"`); it ships no code. The published package is python/ (its own
# pyproject.toml), and tests/ reach the root scripts via sys.path. An empty package list
# stops setuptools' flat-layout auto-discovery from refusing the repo's several top-level
# modules and directories (story 127.481).
[tool.setuptools]
packages = []

# Lint/typecheck policy (story 130.19) is deliberately IDENTICAL to ~/tk/toke-corpus and
# ~/tk/toke-model: ruff's default rule set (no bespoke `select`/`ignore`), line-length 100,
# target py311, and mypy `strict`. Suppressions live at the offending line with a reason,
# never as a file- or project-level disable.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
# `python/` holds the toke_tokenizer package source (not installed); scripts/hf_spike.py
# imports it, so it must resolve for mypy the same way it does at runtime.
mypy_path = "python"

# Untyped third-party packages: no stubs, no py.typed marker, and not installed in CI
# (they are training-box deps). Both facts produce a module-level error under `strict`,
# and both make the module Any either way -- so silencing the import keeps the CI result
# identical to the local one instead of environment-dependent.
[[tool.mypy.overrides]]
module = [
    "sentencepiece.*",
    "tokenizers.*",
    "transformers.*",
]
ignore_missing_imports = true
